apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm.fullname" . }}-python
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "helm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "helm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helm.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "helm.fullname" . }}-postgresql {{ .Values.postgresql.service.port }}; do echo waiting for postgresql; sleep 2; done;']
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.python.containerPort }}
              protocol: TCP
          env:
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_HOST
              value: {{ include "helm.fullname" . }}-postgresql
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm.fullname" . }}-postgresql-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm.fullname" . }}-postgresql-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm.fullname" . }}-postgresql-secret
                  key: POSTGRES_PASSWORD
            {{- else }}
            - name: POSTGRES_HOST
              value: {{ .Values.externalPostgresql.host | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.externalPostgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.externalPostgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalPostgresql.existingSecret | default (printf "%s-external-db-secret" (include "helm.fullname" .)) }}
                  key: {{ .Values.externalPostgresql.existingSecretPasswordKey | default "password" }}
            {{- end }}
            {{- with .Values.python.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.python.livenessProbe.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.python.livenessProbe.initialDelaySeconds | default 15 }}
            periodSeconds: {{ .Values.python.livenessProbe.periodSeconds | default 20 }}
            timeoutSeconds: {{ .Values.python.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.python.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.python.readinessProbe.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.python.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.python.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.python.readinessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.python.readinessProbe.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
